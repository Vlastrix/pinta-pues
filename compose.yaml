services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /app/data/pinta-pues.sqlite
      TRUST_PROXY: "1"
    volumes:
      - pinta_data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  pinta_data:
  caddy_data:
  caddy_config:
